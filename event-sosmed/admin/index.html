<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitenexs — Admin Panel Misi</title>
    
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png" id="faviconImg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #eff6ff;
            --accent: #10b981; --bg-body: #f8fafc; --bg-card: #ffffff;
            --text-main: #0f172a; --text-muted: #475569; --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1; --shadow-card: 0 20px 40px -12px rgba(37, 99, 235, 0.15);
            --radius-md: 0.625rem; --radius-lg: 1rem; --radius-xl: 1.5rem; --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 1rem; }
        .bg-grid-pattern { background-image: linear-gradient(to right, rgba(37, 99, 235, 0.06) 1px, transparent 1px), linear-gradient(to bottom, rgba(37, 99, 235, 0.06) 1px, transparent 1px); background-size: 32px 32px; }
        .bg-gradient-soft { background: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%); }
        .page-section { padding: 5.5rem 0 3rem 0; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.7rem 1.35rem; font-size: 0.88rem; font-weight: 700; border-radius: var(--radius-full); transition: var(--transition); cursor: pointer; border: none; }
        .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.78rem; border-radius: var(--radius-md); }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        .btn-success { background-color: #10b981; color: white; }
        .btn-danger { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .btn-block { width: 100%; border-radius: var(--radius-md); }

        .sitenexs-toast {
            position: fixed; top: 90px; right: 15px; left: 15px; max-width: 400px; margin: 0 auto; background: #ffffff; color: var(--text-main);
            padding: 1rem 1.25rem; border-radius: var(--radius-lg); box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
            border: 1px solid var(--border-subtle); z-index: 99999; display: flex; align-items: center; gap: 0.75rem;
            transform: translateY(-20px); opacity: 0; transition: all 0.4s ease;
        }
        .sitenexs-toast.show { transform: translateY(0); opacity: 1; }

        #navbar { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); }
        .nav-container { display: flex; align-items: center; justify-content: space-between; height: 70px; }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.1rem; }
        .logo-text { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-img { height: 34px; width: 34px; border-radius: 50%; object-fit: cover; }

        /* RESPONSIF LAYOUT ADMIN */
        .admin-layout { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media (min-width: 992px) {
            .admin-layout { grid-template-columns: 380px 1fr; gap: 2rem; align-items: start; }
            .sticky-form { position: sticky; top: 90px; }
        }

        .admin-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 1.25rem; box-shadow: var(--shadow-card); margin-bottom: 1.5rem; }
        @media (min-width: 768px) {
            .admin-card { padding: 2rem; }
        }

        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding-bottom: 0.85rem; border-bottom: 1px solid var(--border-subtle); }
        .admin-header h2 { font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }

        .form-group { margin-bottom: 1.1rem; text-align: left; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 0.35rem; }
        .form-control { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid var(--border-medium); border-radius: var(--radius-md); font-size: 0.9rem; background-color: var(--bg-body); color: var(--text-main); }
        
        .platform-badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.55rem; border-radius: var(--radius-full); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .platform-badge.whatsapp { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .platform-badge.instagram { background: #fdf2f8; color: #db2777; border: 1px solid #fbcfe8; }
        .platform-badge.tiktok { background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; }
        .platform-badge.facebook { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .platform-badge.lainnya { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }

        .list-wrapper { display: flex; flex-direction: column; gap: 0.85rem; max-height: 480px; overflow-y: auto; padding-right: 0.15rem; }
        .admin-item-card { background: var(--bg-body); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
        
        .item-row { display: flex; flex-direction: column; gap: 0.6rem; }
        @media (min-width: 576px) {
            .item-row { flex-direction: row; justify-content: space-between; align-items: flex-start; gap: 1rem; }
        }

        .item-info h4 { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.15rem; word-break: break-word; }
        .item-info p { font-size: 0.82rem; color: var(--text-muted); word-break: break-word; }
        
        .badge-pill { display: inline-flex; align-items: center; background: #ecfdf5; color: #047857; padding: 0.2rem 0.65rem; border-radius: var(--radius-full); font-size: 0.78rem; font-weight: 800; border: 1px solid #a7f3d0; white-space: nowrap; }
        
        .item-actions { display: flex; gap: 0.5rem; justify-content: flex-end; border-top: 1px dashed var(--border-subtle); padding-top: 0.65rem; }
        .footer-simple { text-align: center; padding: 2rem 0; font-size: 0.82rem; color: var(--text-muted); border-top: 1px solid var(--border-subtle); }
    </style>
</head>
<body>

    <header id="navbar">
        <div class="container nav-container">
            <a href="https://sitenexs.com" class="logo">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Logo" class="logo-img">
                <span class="logo-text">SiteNexs Admin</span>
            </a>
            <nav class="nav-links">
                <a href="event.html" class="btn btn-secondary btn-sm" style="background: #f1f5f9; font-size: 0.78rem;"><i class="fas fa-external-link-alt"></i> Event Page</a>
            </nav>
        </div>
    </header>

    <section class="page-section bg-gradient-soft bg-grid-pattern">
        <div class="container">
            <div class="admin-layout">
                <div class="sticky-form">
                    <div class="admin-card">
                        <div class="admin-header">
                            <h2><i class="fas fa-plus-circle text-primary"></i> Tambah Misi</h2>
                        </div>
                        <form id="missionForm" onsubmit="saveMissionWithCompressedImage(event)">
                            <div class="form-group">
                                <label>Kategori Platform</label>
                                <select id="missionPlatform" class="form-control" onchange="handlePlatformChange()" required>
                                    <option value="instagram">Instagram</option>
                                    <option value="whatsapp">WhatsApp (Sebarkan ke Grup)</option>
                                    <option value="tiktok">TikTok</option>
                                    <option value="facebook">Facebook</option>
                                    <option value="lainnya">Lainnya</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Judul Misi</label>
                                <input type="text" id="missionTitle" class="form-control" placeholder="Contoh: Sebarkan Info ke Grup WA" required>
                            </div>
                            <div class="form-group">
                                <label>Reward (Rp)</label>
                                <input type="number" id="missionReward" class="form-control" placeholder="5000" required>
                            </div>
                            <div class="form-group">
                                <label id="descLabel">Deskripsi Instruksi</label>
                                <textarea id="missionDesc" class="form-control" rows="3" placeholder="Tuliskan petunjuk singkat..." required></textarea>
                            </div>
                            <div class="form-group">
                                <label id="urlLabel">Link Tautan Aksi (URL)</label>
                                <input type="text" id="missionUrl" class="form-control" placeholder="https://..." required>
                            </div>
                            <div class="form-group">
                                <label>Isi Postingan / Teks Caption (Opsional)</label>
                                <textarea id="missionPostText" class="form-control" rows="3" placeholder="Teks yang disalin user..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>Foto Banner Misi (Opsional)</label>
                                <input type="file" id="missionImageFile" class="form-control" accept="image/*">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block" id="saveBtn">
                                <i class="fas fa-save"></i> Simpan Misi
                            </button>
                        </form>
                    </div>
                </div>

                <div>
                    <div class="admin-card">
                        <div class="admin-header">
                            <h2><i class="fas fa-tasks text-primary"></i> Verifikasi Tugas Masuk</h2>
                        </div>
                        <div class="list-wrapper" id="submissionsList">
                            <div style="text-align: center; color: var(--text-muted); padding: 2rem;">Memuat tugas masuk...</div>
                        </div>
                    </div>

                    <div class="admin-card">
                        <div class="admin-header">
                            <h2><i class="fas fa-list-alt text-primary"></i> Daftar Misi Aktif</h2>
                        </div>
                        <div class="list-wrapper" id="adminTaskList">
                            <div style="text-align: center; color: var(--text-muted); padding: 2rem;">Memuat daftar misi...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="container"><div class="footer-simple">&copy; 2026 Sitenexs Admin Panel.</div></div>

    <div class="sitenexs-toast" id="toast">
        <div class="sitenexs-toast-icon"><i class="fas fa-check"></i></div>
        <div class="sitenexs-toast-text">
            <h4 id="toastTitle">Berhasil!</h4>
            <p id="toastDesc">Aksi berhasil diproses.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, getDoc } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761',
            measurementId: 'G-C7YL0Q7YRQ'
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handlePlatformChange = function() {
            const platform = document.getElementById('missionPlatform').value;
            const descLabel = document.getElementById('descLabel');
            const urlLabel = document.getElementById('urlLabel');
            if (platform === 'whatsapp') {
                descLabel.innerText = 'Instruksi (Sebarkan ke Grup WhatsApp)';
                urlLabel.innerText = 'Link Undangan Grup WhatsApp (URL)';
            } else {
                descLabel.innerText = 'Deskripsi Instruksi';
                urlLabel.innerText = 'Link Tautan Aksi (URL)';
            }
        }

        async function loadAdminData() {
            loadAdminMissions();
            loadSubmissions();
        }

        async function loadAdminMissions() {
            const listContainer = document.getElementById('adminTaskList');
            try {
                const snap = await getDocs(collection(db, "missions"));
                if (snap.empty) {
                    listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 2rem;">Belum ada misi aktif.</p>';
                    return;
                }
                let html = '';
                snap.forEach(d => {
                    const m = d.data();
                    const platform = m.platform || 'lainnya';
                    html += `
                        <div class="admin-item-card">
                            <div class="item-row">
                                <div class="item-info">
                                    <span class="platform-badge ${platform}">${platform}</span>
                                    <h4>${m.title}</h4>
                                    <p>${m.desc}</p>
                                </div>
                                <div class="badge-pill">+Rp ${Number(m.reward).toLocaleString('id-ID')}</div>
                            </div>
                            <div class="item-actions">
                                <button class="btn btn-danger btn-sm" onclick="deleteMission('${d.id}')"><i class="fas fa-trash"></i> Hapus</button>
                            </div>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } catch (e) {
                listContainer.innerHTML = '<p style="text-align: center; color: red; padding: 2rem;">Gagal memuat misi.</p>';
            }
        }

        async function loadSubmissions() {
            const listContainer = document.getElementById('submissionsList');
            try {
                const snap = await getDocs(collection(db, "submissions"));
                let pendingCount = 0;
                let html = '';

                snap.forEach(d => {
                    const s = d.data();
                    if (s.status === 'pending') {
                        pendingCount++;
                        let screenshotHtml = s.proofImageUrl ? `
                            <div style="margin-top: 0.5rem;">
                                <a href="${s.proofImageUrl}" target="_blank">
                                    <img src="${s.proofImageUrl}" alt="Bukti" style="width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1;">
                                </a>
                            </div>
                        ` : '';

                        html += `
                            <div class="admin-item-card">
                                <div class="item-row">
                                    <div class="item-info">
                                        <h4>${s.missionTitle}</h4>
                                        <p><b>Akun:</b> ${s.username}</p>
                                        <p><b>Catatan:</b> ${s.proof}</p>
                                        ${screenshotHtml}
                                    </div>
                                    <div class="badge-pill">+Rp ${Number(s.reward).toLocaleString('id-ID')}</div>
                                </div>
                                <div class="item-actions">
                                    <button class="btn btn-success btn-sm" onclick="approveSubmission('${d.id}', '${s.uid || s.deviceId}', ${s.reward})"><i class="fas fa-check"></i> Setujui</button>
                                    <button class="btn btn-danger btn-sm" onclick="rejectSubmission('${d.id}')"><i class="fas fa-times"></i> Tolak</button>
                                </div>
                            </div>
                        `;
                    }
                });

                if (pendingCount === 0) {
                    listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 2rem;">Tidak ada tugas menunggu verifikasi.</p>';
                } else {
                    listContainer.innerHTML = html;
                }
            } catch (e) {
                listContainer.innerHTML = '<p style="text-align: center; color: red; padding: 2rem;">Gagal memuat tugas.</p>';
            }
        }

        window.approveSubmission = async function(subId, targetUid, reward) {
            try {
                await updateDoc(doc(db, "submissions", subId), { status: 'approved' });

                if (targetUid && !targetUid.startsWith('device_')) {
                    const userRef = doc(db, "users", targetUid);
                    const userSnap = await getDoc(userRef);
                    let currentBal = 0;
                    if (userSnap.exists()) {
                        currentBal = Number(userSnap.data().balance || 0);
                    }
                    await updateDoc(userRef, { balance: currentBal + Number(reward) });
                } else {
                    let currentBalance = Number(localStorage.getItem('sitenexs_balance')) || 0;
                    currentBalance += Number(reward);
                    localStorage.setItem('sitenexs_balance', currentBalance);
                }

                showToast('Disetujui', `Tugas disetujui! Saldo Rp ${Number(reward).toLocaleString('id-ID')} ditambahkan ke user.`);
                loadSubmissions();
            } catch (e) {
                console.error(e);
                showToast('Gagal', 'Terjadi kesalahan.', 'error');
            }
        }

        window.rejectSubmission = async function(subId) {
            try {
                await updateDoc(doc(db, "submissions", subId), { status: 'rejected' });
                showToast('Ditolak', 'Tugas ditolak.');
                loadSubmissions();
            } catch (e) {
                showToast('Gagal', 'Terjadi kesalahan.', 'error');
            }
        }

        function compressImage(file, maxWidth = 600, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        window.saveMissionWithCompressedImage = async function(e) {
            e.preventDefault();
            const platform = document.getElementById('missionPlatform').value;
            const title = document.getElementById('missionTitle').value.trim();
            const reward = Number(document.getElementById('missionReward').value);
            const desc = document.getElementById('missionDesc').value.trim();
            const url = document.getElementById('missionUrl').value.trim();
            const postText = document.getElementById('missionPostText').value.trim();
            const fileInput = document.getElementById('missionImageFile');
            const saveBtn = document.getElementById('saveBtn');

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

            let imageUrl = '';
            try {
                if (fileInput.files && fileInput.files[0]) {
                    imageUrl = await compressImage(fileInput.files[0], 600, 0.7);
                }
                await addDoc(collection(db, "missions"), { platform, title, reward, desc, url, postText, imageUrl });
                showToast('Berhasil', 'Misi baru berhasil disimpan.');
                document.getElementById('missionForm').reset();
                loadAdminMissions();
            } catch (err) {
                showToast('Gagal', 'Gagal menyimpan misi.', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Misi';
            }
        }

        window.deleteMission = async function(id) {
            if (confirm('Hapus misi ini?')) {
                await deleteDoc(doc(db, "missions", id));
                loadAdminMissions();
                showToast('Terhapus', 'Misi dihapus.');
            }
        }

        loadAdminData();
    </script>
    <script>
        function showToast(title, message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastDesc').innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
    </script>
</body>
</html>
