<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitenexs — Event & Misi Media Sosial</title>
    
    <meta name="description" content="Sitenexs Event. Mitra transformasi digital UMKM Indonesia.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png" id="faviconImg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5; --primary-dark: #4338ca; --primary-light: #e0e7ff;
            --accent: #06b6d4; --accent-purple: #8b5cf6; --accent-emerald: #10b981;
            --bg-body: #f8fafc; --bg-card: #ffffff;
            --text-main: #0f172a; --text-muted: #64748b; --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1; --shadow-card: 0 20px 40px -12px rgba(79, 70, 229, 0.12);
            --radius-md: 0.5rem; --radius-lg: 0.875rem; --radius-xl: 1.25rem; --radius-full: 9999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .bg-grid-pattern { background-image: linear-gradient(to right, rgba(79, 70, 229, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(79, 70, 229, 0.05) 1px, transparent 1px); background-size: 32px 32px; }
        .bg-gradient-soft { background: linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%); }
        .page-section { padding: 5.5rem 0; display: flex; justify-content: center; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem 1.2rem; font-size: 0.88rem; font-weight: 700; border-radius: var(--radius-full); cursor: pointer; border: none; transition: var(--transition); }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
        .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn-secondary { background-color: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-subtle); }
        .btn-secondary:hover { background-color: #e2e8f0; border-color: var(--border-medium); }
        .btn-block { width: 100%; border-radius: var(--radius-md); padding: 0.75rem 1rem; }

        .sitenexs-toast {
            position: fixed; top: 100px; right: 20px; background: #ffffff; color: var(--text-main);
            padding: 1rem 1.25rem; border-radius: var(--radius-lg); box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
            border: 1px solid var(--border-subtle); z-index: 99999; display: flex; align-items: center; gap: 0.75rem;
            transform: translateY(-20px); opacity: 0; transition: all 0.4s ease;
        }
        .sitenexs-toast.show { transform: translateY(0); opacity: 1; }

        /* NAVBAR & LOGO YANG RAPI & PRESISI */
        #navbar { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); }
        .nav-container { display: flex; align-items: center; justify-content: space-between; height: 76px; }
        .logo { display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        .logo-img { height: 40px; width: 40px; min-width: 40px; border-radius: 50%; object-fit: cover; box-shadow: 0 3px 10px rgba(79, 70, 229, 0.25); flex-shrink: 0; }
        .logo-text { font-weight: 800; font-size: 1.25rem; background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2; letter-spacing: -0.3px; }
        
        .nav-links { display: flex; align-items: center; gap: 1.5rem; font-size: 0.9rem; font-weight: 600; }
        .nav-links a { color: var(--text-muted); transition: var(--transition); }
        .nav-links a:hover { color: var(--primary); }

        /* USER PROFILE DROPDOWN MENU */
        .user-profile-wrapper { position: relative; display: inline-block; }
        .user-profile-badge {
            display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.85rem 0.3rem 0.35rem;
            background: #ffffff; border: 1px solid var(--border-medium); border-radius: var(--radius-full);
            font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: var(--transition);
        }
        .user-profile-badge:hover { border-color: var(--primary); }
        .user-initial-avatar { width: 30px; height: 30px; background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 800; flex-shrink: 0; }
        
        .profile-dropdown {
            display: none; position: absolute; right: 0; top: 45px; background: #ffffff;
            border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1); width: 200px; padding: 0.5rem; z-index: 1100;
        }
        .profile-dropdown.show { display: block; animation: fadeInDropdown 0.2s ease; }
        @keyframes fadeInDropdown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        
        .dropdown-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-subtle); margin-bottom: 0.25rem; }
        .dropdown-header span { display: block; font-size: 0.75rem; color: var(--text-muted); }
        .dropdown-header b { font-size: 0.9rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .dropdown-item {
            display: flex; align-items: center; gap: 0.5rem; width: 100%; padding: 0.65rem 1rem;
            background: none; border: none; font-size: 0.88rem; font-weight: 700; color: #ef4444;
            cursor: pointer; border-radius: var(--radius-md); transition: var(--transition); text-align: left;
        }
        .dropdown-item:hover { background: rgba(239, 68, 68, 0.08); }

        .event-container { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; width: 100%; }
        
        .wallet-card { 
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-xl); 
            padding: 2rem; 
            box-shadow: var(--shadow-card); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: relative; 
            overflow: hidden; 
        }
        .wallet-card::before { 
            content: ''; 
            position: absolute; 
            top: 0; left: 0; right: 0; 
            height: 5px; 
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 50%, var(--accent-purple) 100%); 
        }
        .wallet-info h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        .wallet-info .balance { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-top: 0.25rem; }

        .tabs { display: flex; background: var(--bg-card); border-radius: var(--radius-lg); padding: 6px; border: 1px solid var(--border-subtle); box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .tab-btn { flex: 1; background: none; border: none; padding: 0.75rem; font-weight: 700; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-md); transition: var(--transition); font-size: 0.9rem; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }

        /* KATEGORI FILTER PILLS */
        .category-filter-container {
            display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem;
            scrollbar-width: none;
        }
        .category-filter-container::-webkit-scrollbar { display: none; }
        
        .filter-pill {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            padding: 0.5rem 1.1rem; border-radius: var(--radius-full); font-size: 0.85rem;
            font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: var(--transition);
        }
        .filter-pill:hover { border-color: var(--primary); color: var(--primary); }
        .filter-pill.active { background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%); color: white; border-color: transparent; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }

        .section-content { display: none; }
        .section-content.active { display: block; animation: fadeInSec 0.3s ease; }
        @keyframes fadeInSec { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* KARTU MISI YANG SANGAT RAPI & PRESISI */
        .task-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1.25rem; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04); transition: var(--transition); }
        .task-card:hover { border-color: var(--border-medium); box-shadow: 0 8px 25px rgba(79, 70, 229, 0.08); }
        .task-img-container { width: 100%; height: 180px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .task-img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .task-card:hover .task-img-container img { transform: scale(1.03); }
        .task-body { padding: 1.5rem; }
        
        /* HEADER MISI & NOMINAL REWARD DISUSUN DENGAN FLEXBOX PRESISI */
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; gap: 1rem; }
        .task-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); flex: 1; line-height: 1.4; }
        
        .task-reward { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            white-space: nowrap; 
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); 
            color: #047857; 
            padding: 0.35rem 0.85rem; 
            border-radius: var(--radius-full); 
            font-size: 0.85rem; 
            font-weight: 800; 
            border: 1px solid #a7f3d0; 
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.1); 
            flex-shrink: 0;
            line-height: 1.2;
        }
        
        .task-desc { font-size: 0.93rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.5; }
        
        .platform-badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.5px; }
        .platform-badge.whatsapp { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .platform-badge.instagram { background: #fdf2f8; color: #db2777; border: 1px solid #fbcfe8; }
        .platform-badge.tiktok { background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; }
        .platform-badge.facebook { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .platform-badge.lainnya { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }

        .post-text-box { background: #f8fafc; border: 1px dashed var(--border-medium); border-radius: var(--radius-md); padding: 0.85rem; font-size: 0.85rem; margin-bottom: 1.25rem; }
        .post-text-box p { color: var(--text-muted); font-weight: 700; margin-bottom: 0.25rem; }
        .post-text-box textarea { width: 100%; background: transparent; border: none; resize: none; font-family: inherit; font-size: 0.85rem; color: var(--text-main); outline: none; }
        
        /* TOMBOL AKSI KECIL & RAPI */
        .task-action { display: flex; gap: 0.5rem; align-items: center; margin-top: 1rem; }
        .task-action .btn {
            flex: 1;
            padding: 0.5rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            box-shadow: none;
            letter-spacing: 0.2px;
        }
        .task-action .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
        }
        .task-action .btn-secondary:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
            border-color: var(--border-medium);
        }
        .task-action .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%);
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(79, 70, 229, 0.2);
        }

        .history-item { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .history-info h4 { font-size: 1rem; font-weight: 800; margin-bottom: 0.25rem; color: var(--text-main); }
        .history-info p { font-size: 0.85rem; color: var(--text-muted); }
        .history-status { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; }
        .status-badge { font-size: 0.75rem; font-weight: 800; padding: 0.25rem 0.7rem; border-radius: var(--radius-full); text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.pending { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .status-badge.approved { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-badge.rejected { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .history-reward-add { font-size: 0.95rem; font-weight: 800; color: #059669; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); justify-content: center; align-items: center; padding: 1.5rem; z-index: 9999; }
        .modal-content { background: var(--bg-card); width: 100%; max-width: 460px; padding: 2rem; border-radius: var(--radius-xl); box-shadow: 0 20px 35px rgba(0,0,0,0.15); border: 1px solid var(--border-subtle); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
        .modal-header h3 { font-size: 1.15rem; font-weight: 800; }
        .close-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .close-btn:hover { background: #e2e8f0; color: var(--text-main); }
        .form-group { margin-bottom: 1.25rem; text-align: left; }
        .form-group label { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); }
        .form-control { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-medium); border-radius: var(--radius-md); font-size: 0.95rem; background-color: var(--bg-body); color: var(--text-main); outline: none; transition: var(--transition); }
        .form-control:focus { border-color: var(--primary); background-color: #ffffff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .footer-simple { text-align: center; padding: 3rem 0; font-size: 0.88rem; color: var(--text-muted); border-top: 1px solid var(--border-subtle); margin-top: 4rem; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <header id="navbar">
        <div class="container nav-container">
            <a href="https://sitenexs.com" class="logo">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Logo" class="logo-img">
                <span class="logo-text">SiteNexs</span>
            </a>
            <nav class="nav-links">
                <a href="https://sitenexs.com/#demo-produk">Demo</a>
                <a href="https://sitenexs.com/#solusi-digital">Solusi</a>
                <a href="https://sitenexs.com/#harga">Harga</a>
                <a href="https://sitenexs.com/#tentang">Tentang Kami</a>
            </nav>
            <div id="authNavContainer">
                <a href="sign-in.html" class="btn btn-primary btn-sm"><i class="fas fa-sign-in-alt"></i> Masuk</a>
            </div>
        </div>
    </header>

    <section class="page-section bg-gradient-soft bg-grid-pattern" style="padding-top: 120px;">
        <div class="container">
            <div class="event-container">
                <div class="wallet-card">
                    <div class="wallet-info">
                        <h3>Saldo Reward Anda</h3>
                        <div class="balance" id="userBalance">Rp 0</div>
                    </div>
                    <button class="btn btn-primary" onclick="showWithdrawModal()"><i class="fas fa-wallet"></i> Tarik Saldo</button>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('tasks')"><i class="fas fa-tasks"></i> Misi Tersedia</button>
                    <button class="tab-btn" onclick="switchTab('history')"><i class="fas fa-history"></i> Riwayat</button>
                </div>

                <!-- KATEGORI FILTER SOSMED -->
                <div id="filterCategoryContainer" style="display: block;">
                    <div class="category-filter-container">
                        <button class="filter-pill active" onclick="filterMissions('all', this)">Semua Misi</button>
                        <button class="filter-pill" onclick="filterMissions('instagram', this)"><i class="fab fa-instagram"></i> Instagram</button>
                        <button class="filter-pill" onclick="filterMissions('whatsapp', this)"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                        <button class="filter-pill" onclick="filterMissions('tiktok', this)"><i class="fab fa-tiktok"></i> TikTok</button>
                        <button class="filter-pill" onclick="filterMissions('facebook', this)"><i class="fab fa-facebook"></i> Facebook</button>
                        <button class="filter-pill" onclick="filterMissions('lainnya', this)"><i class="fas fa-globe"></i> Lainnya</button>
                    </div>
                </div>

                <div id="tasksSection" class="section-content active">
                    <div class="task-card" style="text-align: center; color: var(--text-muted); padding: 3rem 1.5rem;">
                        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 0.75rem; display: block; color: var(--primary);"></i> Memuat misi...
                    </div>
                </div>

                <div id="historySection" class="section-content">
                    <div id="historyListContainer">
                        <div class="task-card" style="text-align: center; color: var(--text-muted); padding: 3rem 1.5rem;">Memuat riwayat...</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="container"><div class="footer-simple">&copy; 2026 Sitenexs. All rights reserved.</div></div>

    <div class="modal" id="submitModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTaskTitle">Kumpul Bukti Tugas</h3>
                <button class="close-btn" onclick="closeSubmitModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="form-group">
                <label>Akun / Username Anda</label>
                <input type="text" id="taskInput" class="form-control" placeholder="Masukkan username Anda" required>
            </div>
            <div class="form-group">
                <label>Link Postingan / Keterangan Bukti</label>
                <input type="text" id="proofLink" class="form-control" placeholder="Contoh link atau catatan">
            </div>
            <div class="form-group">
                <label>Upload Screenshot Bukti <span style="color: #ef4444;">*Wajib</span></label>
                <input type="file" id="proofImageFile" class="form-control" accept="image/*" required>
            </div>
            <button class="btn btn-primary btn-block" id="submitTaskBtn" onclick="submitTask()">
                <i class="fas fa-check-circle"></i> Kirim Bukti ke Admin
            </button>
        </div>
    </div>

    <div class="modal" id="withdrawModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Tarik Saldo Reward</h3>
                <button class="close-btn" onclick="closeWithdrawModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="form-group">
                <label>Metode Penarikan</label>
                <select class="form-control" id="withdrawMethod">
                    <option value="DANA">DANA E-Wallet</option>
                    <option value="OVO">OVO / GoPay</option>
                    <option value="BCA">Bank BCA</option>
                </select>
            </div>
            <div class="form-group">
                <label>Nomor Akun / Rekening Tujuan</label>
                <input type="text" id="accountNumber" class="form-control" placeholder="Contoh: 085177137899">
            </div>
            <button class="btn btn-primary btn-block" onclick="processWithdraw()">Ajukan Penarikan</button>
        </div>
    </div>

    <div class="sitenexs-toast" id="toast">
        <div class="sitenexs-toast-icon" style="color: var(--accent-emerald);"><i class="fas fa-check-circle"></i></div>
        <div class="sitenexs-toast-text">
            <h4 id="toastTitle">Berhasil!</h4>
            <p id="toastDesc">Aksi berhasil diproses.</p>
        </div>
    </div>

        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';

        const firebaseConfig = {

            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761',
            measurementId: 'G-C7YL0Q7YRQ'
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUserUid = localStorage.getItem('sitenexs_uid');
        let currentBalance = 0;
        let selectedMission = null;
        let allMissionsCache = [];
        let currentFilter = 'all';

        async function fetchUserBalance(uid) {
            try {
                if (uid && !uid.startsWith('device_')) {
                    const userDoc = await getDoc(doc(db, "users", uid));
                    if (userDoc.exists()) {
                        currentBalance = Number(userDoc.data().balance || 0);
                    } else {
                        currentBalance = Number(localStorage.getItem('sitenexs_balance')) || 0;
                    }
                } else {
                    currentBalance = Number(localStorage.getItem('sitenexs_balance')) || 0;
                }
            } catch (e) {
                currentBalance = Number(localStorage.getItem('sitenexs_balance')) || 0;
            }
            document.getElementById('userBalance').innerText = 'Rp ' + currentBalance.toLocaleString('id-ID');
        }

        onAuthStateChanged(auth, async (user) => {
            const authContainer = document.getElementById('authNavContainer');
            if (user) {
                currentUserUid = user.uid;
                localStorage.setItem('sitenexs_logged_in', 'true');
                localStorage.setItem('sitenexs_uid', user.uid);

                let displayName = user.displayName || 'Akun Sitenexs';
                try {
                    const userSnap = await getDoc(doc(db, "users", user.uid));
                    if (userSnap.exists() && userSnap.data().namaLengkap) {
                        displayName = userSnap.data().namaLengkap;
                    }
                } catch (e) {}

                const initial = displayName.charAt(0).toUpperCase();
                authContainer.innerHTML = `
                    <div class="user-profile-wrapper">
                        <div class="user-profile-badge" onclick="toggleProfileDropdown()" title="${displayName}">
                            <div class="user-initial-avatar">${initial}</div>
                            <span>${displayName.split(' ')[0]} <i class="fas fa-chevron-down" style="font-size: 0.75rem; margin-left: 2px;"></i></span>
                        </div>
                        <div class="profile-dropdown" id="profileDropdown">
                            <div class="dropdown-header">
                                <span>Masuk sebagai:</span>
                                <b>${displayName}</b>
                            </div>
                            <button class="dropdown-item" onclick="handleLogout()">
                                <i class="fas fa-sign-out-alt"></i> Keluar Akun
                            </button>
                        </div>
                    </div>
                `;
            } else {
                authContainer.innerHTML = `
                    <a href="sign-in.html" class="btn btn-primary btn-sm"><i class="fas fa-sign-in-alt"></i> Masuk</a>
                `;
            }
            await fetchUserBalance(currentUserUid);
            fetchMissions();
        });

        window.toggleProfileDropdown = function() {
            const dropdown = document.getElementById('profileDropdown');
            if (dropdown) dropdown.classList.toggle('show');
        }

        window.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.user-profile-wrapper');
            const dropdown = document.getElementById('profileDropdown');
            if (wrapper && dropdown && !wrapper.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });

        window.handleLogout = async function() {
            if (confirm('Apakah Anda yakin ingin keluar dari akun?')) {
                try {
                    await signOut(auth);
                    localStorage.removeItem('sitenexs_logged_in');
                    localStorage.removeItem('sitenexs_uid');
                    localStorage.removeItem('sitenexs_balance');
                    showToast('Berhasil Keluar', 'Anda telah keluar dari akun.');
                    setTimeout(() => { window.location.reload(); }, 1000);
                } catch (e) {
                    showToast('Gagal', 'Gagal keluar akun.', 'error');
                }
            }
        }

        async function fetchMissions() {
            const tasksSection = document.getElementById('tasksSection');
            if (!tasksSection) return;

            try {
                const missionsSnap = await getDocs(collection(db, "missions"));
                if (missionsSnap.empty) {
                    tasksSection.innerHTML = '<div class="task-card" style="text-align: center; color: var(--text-muted); padding: 3rem 1.5rem;">Belum ada misi tersedia saat ini.</div>';
                    return;
                }

                let submittedMissionIds = [];
                const subSnap = await getDocs(collection(db, "submissions"));
                subSnap.forEach(sDoc => {
                    const sData = sDoc.data();
                    if (sData.uid === currentUserUid && (sData.status === 'approved' || sData.status === 'pending')) {
                        submittedMissionIds.push(sData.missionId);
                    }
                });

                allMissionsCache = [];
                missionsSnap.forEach((docSnap) => {
                    const missionId = docSnap.id;
                    if (!submittedMissionIds.includes(missionId)) {
                        allMissionsCache.push({ id: missionId, ...docSnap.data() });
                    }
                });

                renderFilteredMissions();
            } catch (error) {
                tasksSection.innerHTML = '<div class="task-card" style="text-align: center; color: red; padding: 3rem 1.5rem;">Gagal memuat misi.</div>';
            }
        }

        window.filterMissions = function(platform, btnElement) {
            currentFilter = platform;
            document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            renderFilteredMissions();
        }

        function renderFilteredMissions() {
            const tasksSection = document.getElementById('tasksSection');
            if (!tasksSection) return;

            let filtered = allMissionsCache;
            if (currentFilter !== 'all') {
                filtered = allMissionsCache.filter(m => (m.platform || 'lainnya').toLowerCase() === currentFilter);
            }

            if (filtered.length === 0) {
                tasksSection.innerHTML = '<div class="task-card" style="text-align: center; color: var(--text-muted); padding: 3rem 1.5rem;">Tidak ada misi tersedia untuk kategori ini.</div>';
                return;
            }

            let html = '';
            filtered.forEach(m => {
                const rewardFormatted = Number(m.reward || 0).toLocaleString('id-ID');
                const platform = m.platform || 'lainnya';
                let iconClass = 'fa-globe';
                if (platform === 'instagram') iconClass = 'fab fa-instagram';
                else if (platform === 'whatsapp') iconClass = 'fab fa-whatsapp';
                else if (platform === 'tiktok') iconClass = 'fab fa-tiktok';
                else if (platform === 'facebook') iconClass = 'fab fa-facebook';

                let imgHtml = m.imageUrl ? `<div class="task-img-container"><img src="${m.imageUrl}" alt="${m.title}"></div>` : '';
                let postTextBox = m.postText ? `
                    <div class="post-text-box">
                        <p><i class="fas fa-quote-left"></i> Caption:</p>
                        <textarea rows="2" readonly id="text_${m.id}">${m.postText}</textarea>
                        <button class="btn btn-secondary btn-sm" style="margin-top: 0.4rem; width: 100%; font-size: 0.75rem; padding: 0.35rem;" onclick="copyPostText('text_${m.id}')"><i class="fas fa-copy"></i> Salin Teks</button>
                    </div>
                ` : '';

                html += `
                    <div class="task-card">
                        ${imgHtml}
                        <div class="task-body">
                            <span class="platform-badge ${platform}"><i class="${iconClass}"></i> ${platform}</span>
                            <div class="task-header">
                                <div class="task-title">${m.title}</div>
                                <div class="task-reward">+Rp ${rewardFormatted}</div>
                            </div>
                            <div class="task-desc">${m.desc}</div>
                            ${postTextBox}
                            <div class="task-action">
                                <a href="${m.url || '#'}" target="_blank" class="btn btn-secondary"><i class="fas fa-external-link-alt"></i> Buka Tautan</a>
                                <button class="btn btn-primary" onclick="openSubmitModal('${m.id}', '${m.title.replace(/'/g, "\\'")}', ${m.reward})"><i class="fas fa-paper-plane"></i> Kumpul Tugas</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            tasksSection.innerHTML = html;
        }

        window.copyPostText = function(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            showToast('Berhasil Disalin!', 'Teks berhasil disalin.');
        }

        window.loadHistory = async function() {
            const historyContainer = document.getElementById('historyListContainer');
            if (!historyContainer) return;

            try {
                const subSnap = await getDocs(collection(db, "submissions"));
                let html = '';
                let count = 0;

                subSnap.forEach(sDoc => {
                    const s = sDoc.data();
                    if (s.uid === currentUserUid) {
                        count++;
                        let badgeClass = s.status === 'approved' ? 'approved' : s.status === 'rejected' ? 'rejected' : 'pending';
                        let statusText = s.status === 'approved' ? 'Disetujui (Selesai)' : s.status === 'rejected' ? 'Ditolak Admin' : 'Menunggu Verifikasi';

                        let rewardAdd = s.status === 'approved' ? `<div class="history-reward-add">+Rp ${Number(s.reward).toLocaleString('id-ID')}</div>` : `<span style="font-size: 0.82rem; color: var(--text-muted);">Estimasi: Rp ${Number(s.reward).toLocaleString('id-ID')}</span>`;

                        html += `
                            <div class="history-item">
                                <div class="history-info">
                                    <h4>${s.missionTitle}</h4>
                                    <p><b>Akun:</b> ${s.username}</p>
                                </div>
                                <div class="history-status">
                                    <span class="status-badge ${badgeClass}">${statusText}</span>
                                    ${rewardAdd}
                                </div>
                            </div>
                        `;
                    }
                });

                historyContainer.innerHTML = count === 0 ? '<div class="task-card" style="text-align: center; color: var(--text-muted); padding: 3rem 1.5rem;">Belum ada riwayat.</div>' : html;
            } catch (err) {
                historyContainer.innerHTML = '<p style="text-align: center; color: red;">Gagal memuat riwayat.</p>';
            }
        }

        window.openSubmitModal = function(missionId, title, reward) {
            if (!currentUserUid) {
                alert('Silakan Masuk terlebih dahulu untuk mengumpulkan tugas!');
                window.location.href = 'sign-in.html';
                return;
            }
            selectedMission = { missionId, title, reward };
            document.getElementById('modalTaskTitle').innerText = 'Misi: ' + title;
            document.getElementById('submitModal').style.display = 'flex';
        }

        window.closeSubmitModal = function() {
            document.getElementById('submitModal').style.display = 'none';
        }

        function compressImage(file, maxWidth = 600, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        window.submitTask = async function() {
            const taskInput = document.getElementById('taskInput').value.trim();
            const proofLink = document.getElementById('proofLink').value.trim();
            const fileInput = document.getElementById('proofImageFile');
            const submitBtn = document.getElementById('submitTaskBtn');

            if (!taskInput) { alert('Masukkan username Anda!'); return; }
            if (!fileInput.files || !fileInput.files[0]) { alert('Wajib mengunggah screenshot!'); return; }

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Mengirim...';

            try {
                let proofImageUrl = await compressImage(fileInput.files[0], 600, 0.7);
                await addDoc(collection(db, "submissions"), {
                    missionId: selectedMission.missionId,
                    missionTitle: selectedMission.title,
                    reward: selectedMission.reward,
                    uid: currentUserUid,
                    username: taskInput,
                    proof: proofLink || '-',
                    proofImageUrl: proofImageUrl,
                    status: 'pending',
                    createdAt: new Date().toISOString()
                });

                closeSubmitModal();
                showToast('Tugas Terkirim!', 'Bukti berhasil dikirim.');
                document.getElementById('taskInput').value = '';
                document.getElementById('proofLink').value = '';
                fileInput.value = '';
                fetchMissions();
                loadHistory();
            } catch (err) {
                showToast('Gagal', 'Terjadi kesalahan.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Kirim Bukti ke Admin';
            }
        }

        window.showWithdrawModal = function() {
            if (currentBalance <= 0) { showToast('Saldo Kosong', 'Saldo masih Rp 0!', 'error'); return; }
            document.getElementById('withdrawModal').style.display = 'flex';
        }
        window.closeWithdrawModal = function() { document.getElementById('withdrawModal').style.display = 'none'; }
        window.processWithdraw = function() {
            currentBalance = 0;
            localStorage.setItem('sitenexs_balance', 0);
            document.getElementById('userBalance').innerText = 'Rp 0';
            closeWithdrawModal();
            showToast('Penarikan Diajukan', 'Permintaan berhasil dikirim.');
        }

        window.switchTab = async function(tabName) {
            const taskBtn = document.querySelectorAll('.tab-btn')[0];
            const historyBtn = document.querySelectorAll('.tab-btn')[1];
            const tasksSec = document.getElementById('tasksSection');
            const historySec = document.getElementById('historySection');
            const filterCont = document.getElementById('filterCategoryContainer');

            if (tabName === 'tasks') {
                taskBtn.classList.add('active'); historyBtn.classList.remove('active');
                tasksSec.classList.add('active'); historySec.classList.remove('active');
                if (filterCont) filterCont.style.display = 'block';
                fetchMissions();
            } else {
                historyBtn.classList.add('active'); taskBtn.classList.remove('active');
                historySec.classList.add('active'); tasksSec.classList.remove('active');
                if (filterCont) filterCont.style.display = 'none';
                await fetchUserBalance(currentUserUid);
                loadHistory();
            }
        }

        function showToast(title, message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastDesc').innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
    </script>
</body>
</html>
